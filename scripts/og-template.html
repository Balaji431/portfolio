<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background-color: #F4EFE6;
      color: #1A1A1A;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 100px;
      position: relative;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #D9D1C2;
      padding-bottom: 24px;
    }
    .site-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #6B645A;
      letter-spacing: -0.01em;
    }
    .accent-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #E8542A;
      margin-right: 8px;
    }
    .center-content {
      margin-top: auto;
      margin-bottom: auto;
    }
    .name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 130px;
      line-height: 0.88;
      letter-spacing: -0.03em;
      color: #1A1A1A;
      font-weight: 400;
    }
    .subtitle {
      font-size: 26px;
      color: #6B645A;
      margin-top: 28px;
      font-weight: 400;
      max-width: 800px;
      line-height: 1.4;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid #D9D1C2;
      padding-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #6B645A;
    }
    .accent-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background-color: #E8542A;
    }
  </style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="top-bar">
    <div class="site-tag"><span class="accent-dot"></span>balajidasetti.space</div>
    <div class="site-tag">Portfolio</div>
  </div>

  <div class="center-content">
    <h1 class="name">Balaji Dasetti</h1>
    <p class="subtitle">Junior Full Stack Developer · Flutter, PHP 8.2, MySQL</p>
  </div>

  <div class="bottom-bar">
    <div>Based in Chennai, India</div>
    <div>2026</div>
  </div>
</body>
</html>
